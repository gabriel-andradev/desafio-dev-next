services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cobuccio-wallet-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: "file:./prod.db"
      FRONTEND_URL: "http://localhost:3000"
      # Local-only default so a fresh clone boots with no .env; override via shell or a root .env file.
      JWT_SECRET: "${JWT_SECRET:-local-dev-only-secret-change-me-before-any-real-deploy}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1d}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3333/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cobuccio-wallet-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://backend:3333/api"
    depends_on:
      backend:
        condition: service_healthy

