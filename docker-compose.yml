services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cobuccio-wallet-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: "file:./prod.db"
      JWT_SECRET: ${JWT_SECRET:-cobuccio-dev-secret-key-change-in-production}
      JWT_EXPIRES_IN: "1d"
      FRONTEND_URL: "http://localhost:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3333/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cobuccio-wallet-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://backend:3333/api"
    depends_on:
      backend:
        condition: service_healthy

